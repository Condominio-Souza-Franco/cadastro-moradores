<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta simples por apartamento</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <style>
    :root {
      --primary-color: #2c3e50;
      --primary-color-soft: #3b5873;
      --accent-color: #1f5d99;
      --surface: #ffffff;
      --surface-soft: #f7fafc;
      --border: #d9e4ef;
      --text: #243447;
      --muted: #5f7287;
      --ok: #0b6a2f;
      --error: #a12622;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, #e8f0f8 0%, #f5f8fc 38%, #f7fafc 100%);
      color: var(--text);
    }

    .container {
      max-width: 760px;
      margin: 28px auto 40px;
      padding: 0 16px 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 28px rgba(31, 45, 61, 0.08);
    }

    .topo-links {
      margin-bottom: 12px;
      font-size: 0.92rem;
    }

    .topo-links a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
    }

    .topo-links a:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
      color: var(--primary-color);
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .linha {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }

    select, button {
      height: 42px;
      border-radius: 8px;
      border: 1px solid #b9c8d8;
      padding: 0 12px;
      font-size: 0.95rem;
    }

    label {
      font-weight: 700;
      color: var(--primary-color);
    }

    select {
      min-width: 128px;
      width: 128px;
      background: #fff;
    }

    select option:disabled {
      color: #94a3b8;
      background: #eef2f7;
    }

    button {
      background: var(--accent-color);
      color: #fff;
      cursor: pointer;
      border-color: var(--accent-color);
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background: #174a7a;
    }

    .status {
      min-height: 22px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .status.erro {
      color: var(--error);
    }

    .status.ok {
      color: var(--ok);
    }

    .resultado {
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .resultado.vazio {
      min-height: 0;
      gap: 0;
    }

    .resultado.vazio .resultado-placeholder {
      display: none;
    }

    .secao.inativa {
      opacity: 0.82;
      filter: grayscale(1);
    }

    .secao.compacta {
      padding: 10px 12px;
    }

    .secao.compacta .grid-campos {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .resultado-placeholder {
      background: var(--surface-soft);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 16px;
      color: var(--muted);
    }

    .secao {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      width: fit-content;
      max-width: 100%;
      display: inline-flex;
      flex-direction: column;
    }

    .secao h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--primary-color-soft);
      width: 100%;
    }

    .grid-campos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }

    .campo {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      width: fit-content;
      max-width: min(100%, 220px);
      flex: 0 1 auto;
    }

    .campo-titulo {
      margin: 0 0 4px;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .campo-valor {
      margin: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.35;
      font-size: 0.95rem;
    }

    .campo-frase {
      max-width: 100%;
      width: fit-content;
    }

    .campo-link-telefone {
      color: var(--accent-color);
      text-decoration: none;
    }

    .campo-link-telefone:hover {
      text-decoration: underline;
    }

    .campo.vazio .campo-valor {
      color: #7c8a99;
    }

    .campo.vazio {
      background: #f2f4f7;
      border-color: #d8dee6;
    }

    .subsecao {
      margin-top: 12px;
    }

    .subsecao h3 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      color: var(--primary-color-soft);
    }

    .registro-bloco {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      width: fit-content;
      max-width: 100%;
    }

    .registro-titulo {
      margin: 0 0 10px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .registro-bloco .grid-campos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .registro-bloco .campo {
      max-width: min(100%, 220px);
    }

    .registro-lista {
      display: grid;
      gap: 10px;
    }

    .lista-contratos {
      margin: 0;
      padding-left: 18px;
    }

    .lista-contratos li {
      margin-bottom: 6px;
    }

    .lista-contratos a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .lista-contratos a:hover {
      text-decoration: underline;
    }

    .sem-itens {
      color: var(--muted);
      font-style: italic;
      margin: 0;
    }

    @media (max-width: 720px) {
      .linha {
        align-items: stretch;
      }

      select, button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="topo-links">
        <a href="index.html">Voltar para o cadastro</a>
      </div>
      <h1>Consulta simples por apartamento</h1>
      <p>Selecione o apartamento para carregar todas as informações disponíveis no cadastro.</p>

      <div class="linha">
        <label for="aptoAdmin">Apartamento:</label>
        <select id="aptoAdmin">
          <option value="">Selecione...</option>
        </select>
        <button type="button" id="btnBuscarApto">Carregar dados</button>
      </div>

      <div id="statusAdmin" class="status"></div>
      <div id="resultadoAdmin" class="resultado vazio">
        <div class="resultado-placeholder">Nenhum dado carregado.</div>
      </div>
    </div>
  </div>

  <script src="js/regras.js"></script>
  <script src="js/admin-simples.js"></script>
</body>
</html>
