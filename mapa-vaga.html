<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa da garagem - Condomínio Souza Franco</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#2c3e50">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="shortcut icon" href="favicon/favicon.ico">

  <!-- Mapa da garagem com a vaga do morador pintada. Endereço: mapa-vaga.html?apto=606&andar=G1&vaga=14
       (sem parâmetros, mostra os dois andares sem destaque). "Salvar em PDF" usa a impressão do
       navegador em A4 paisagem, uma garagem por página. -->
  <style>
    :root { --texto: #243447; --suave: #5f7287; --borda: #d7dee6; --destaque: #e65100; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--texto); background: #f4f6f8; }
    .topo { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .topo h1 { margin: 0; font-size: 1.25rem; }
    .topo p { margin: 4px 0 0; color: var(--suave); }
    .topo .sua-vaga { color: var(--texto); font-size: 1.05rem; }
    .topo .sua-vaga strong { color: var(--destaque); }
    .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
    .acoes button, .acoes a { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--borda); background: #fff; color: var(--texto); font-size: 0.95rem; cursor: pointer; text-decoration: none; }
    .acoes button { background: #2c3e50; border-color: #2c3e50; color: #fff; }
    main { max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; }
    .folha { background: #fff; border: 1px solid var(--borda); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .folha h2 { margin: 0 0 8px; font-size: 1rem; }
    .folha svg { display: block; width: 100%; height: auto; }
    .erro { color: #b3261e; }

    /* Destaque da vaga do morador */
    .vaga.destaque rect { fill: #ffd180 !important; stroke: #e65100 !important; stroke-width: 7 !important; }
    .vaga.destaque .num-vaga circle { fill: #e65100; }
    .vaga.destaque .apto { fill: #7a2e00; }

    @page { size: A4 landscape; margin: 8mm; }
    @media print {
      body { background: #fff; }
      .acoes, .nao-imprimir { display: none !important; }
      .topo { padding: 0 0 4mm; max-width: none; }
      main { padding: 0; max-width: none; }
      .folha { border: 0; padding: 0; margin: 0; page-break-after: always; break-after: page; }
      .folha:last-child { page-break-after: auto; break-after: auto; }
      .folha svg { max-height: 172mm; width: auto; max-width: 100%; margin: 0 auto; }
    }
  </style>
  <script src="js/regras.js?v=20260926m" defer></script>
  <script src="js/data/backend.js?v=20260926m" defer></script>
  <script src="js/mapa-vaga.js?v=20260926m" defer></script>
</head>
<body>
  <header class="topo">
    <div>
      <h1>Mapa da garagem — Condomínio Souza Franco</h1>
      <p id="textoVaga" class="sua-vaga">Carregando...</p>
    </div>
    <div class="acoes">
      <button type="button" id="btnImprimir">Salvar em PDF / imprimir</button>
      <a href="index.html" class="nao-imprimir">Voltar ao cadastro</a>
    </div>
  </header>
  <main id="mapas"></main>
</body>
</html>
